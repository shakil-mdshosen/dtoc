{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdn.form.io/formiojs/formio.full.min.css">
<script src="https://cdn.form.io/formiojs/formio.full.min.js"></script>
{% endblock %}

{% block content %}
<div class="bg-white shadow sm:rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4">Create New Form</h2>
    
    <form method="POST" action="{{ url_for('forms.builder') }}" id="saveForm">
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-700">Form Title</label>
            <input type="text" name="title" id="title" required class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md p-2 border">
        </div>
        
        <input type="hidden" name="schema" id="schemaInput">
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Form Builder</label>
            <div id="builder" class="border border-gray-300 rounded p-4 bg-gray-50"></div>
        </div>
        
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Save Form
        </button>
    </form>
</div>

<script>
    window.onload = function() {
        Formio.builder(document.getElementById('builder'), {}, {
            builder: {
                basic: false,
                advanced: false,
                data: false,
                premium: false,
                customBasic: {
                    title: 'Basic Components',
                    default: true,
                    weight: 0,
                    components: {
                        textfield: true,
                        textarea: true,
                        email: true,
                        phoneNumber: true,
                        number: true,
                        checkbox: true,
                        selectboxes: true,
                        select: true,
                        radio: true,
                        button: true
                    }
                }
            }
        }).then(function(builder) {
            builder.on('saveComponent', function() {
                document.getElementById('schemaInput').value = JSON.stringify(builder.schema);
            });
            builder.on('editComponent', function() {
                document.getElementById('schemaInput').value = JSON.stringify(builder.schema);
            });
            builder.on('deleteComponent', function() {
                document.getElementById('schemaInput').value = JSON.stringify(builder.schema);
            });
            
            // Initial schema
            document.getElementById('schemaInput').value = JSON.stringify(builder.schema);
            
            document.getElementById('saveForm').addEventListener('submit', function(e) {
                // Ensure latest schema is saved
                document.getElementById('schemaInput').value = JSON.stringify(builder.schema);
            });
        });
    };
</script>
{% endblock %}
